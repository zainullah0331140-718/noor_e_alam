name: noor_e_amal
description: "Ibadah Tracker /عبادت ٹریکر — a premium cross-platform Islamic daily life tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # archive must be >= 4.1.0: image 4.12.0 calls ZLibDecoder.decodeLazy(),
  # which only exists from archive 4.1.0 onwards. archive 4.0.10 does not exist
  # on pub.dev (releases jump 4.0.9 -> 4.1.0), so the old "^4.0.10" pin could
  # never resolve.
  archive: ^4.5.2
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------
  # State management (Riverpod - no codegen, plain Notifier/FutureProvider)
  # ---------------------------------------------------------------------
  flutter_riverpod: ^3.4.3

  # ---------------------------------------------------------------------
  # Local persistence: Drift (compile-safe SQLite) on every platform.
  # ---------------------------------------------------------------------
  drift: ^2.35.2
  sqlite3: 3.5.2 # 3.6+ pulls record_use/meta>1.18 which Flutter 3.44 pins
  sqlite3_flutter_libs: ^0.5.41
  sqflite_common_ffi: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1

  # ---------------------------------------------------------------------
  # UI: charts, animation and offline (bundled) fonts
  # ---------------------------------------------------------------------
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1 # 9.x needs Dart ^3.13 (Flutter 3.45+) # configured for OFFLINE use (bundled TTFs)

  # ---------------------------------------------------------------------
  # Dates & numbers: Gregorian formatting + Hijri (Islamic) calendar
  # ---------------------------------------------------------------------
  intl: 0.20.2 # pinned by flutter_localizations
  hijri: ^3.0.1

  # Prayer times (adhan) — pure Dart, computed from the saved location
  adhan: ^2.0.0+1

  # Lightweight key/value prefs (splash seen, cached UI flags)
  shared_preferences: ^2.5.6

  # Keep the screen awake during long tasbeeh/azkar counting sessions
  wakelock_plus: ^1.3.2
  crypto: ^3.0.7

  # ---------------------------------------------------------------------
  # Phase 4: bilingual PDF reports, printing, local reminders & sharing.
  # ---------------------------------------------------------------------
  # Version matrix (all of these must move together):
  #   pdf 3.13.1      -> archive >=3.4.0 <5.0.0, xml >=7.0.1 <8.0.0
  #   image 4.12.0    -> archive ^4.5.0
  #   printing 5.15.1 -> pdf ^3.13.0, image <=5.0.0
  #   fln 22.3.2      -> fln_windows ^3.1.1 -> xml >=6.5.0 <8.0.0, timezone ^0.11.0
  # xml 6.x cannot coexist with xml 7.x, so pdf 3.13.x (xml 7.x) requires
  # flutter_local_notifications >= 22.0.0 (the first release whose Windows
  # backend accepts xml 7.x).
  pdf: ^3.13.1
  printing: ^5.15.1
  # NOTE: v20.0.0 converted show()/zonedSchedule()/cancel()/initialize() from
  # positional to NAMED parameters (breaking change).
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  share_plus: ^11.1.0
  file_picker: ^10.3.3

  # Transitive deps of pdf/printing/flutter_local_notifications_windows are
  # pinned explicitly so the xml/archive/image major versions stay in sync.
  image: ^4.12.0
  xml: ">=7.0.1 <7.1.0" # xml 7.1.0 requires Dart ^3.13 (this SDK is 3.12.2)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  # Pinned: 2.17.0 is yanked and 2.17.1 requires build 5.x which drift_dev
  # does not support yet. 2.16.2 (build 4.x) is the newest usable release.
  build_runner: 2.15.1 # 2.15.2+ requires analyzer>=13.3 -> meta>=1.18.3, pinned 1.18.0 by Flutter 3.44

flutter:
  uses-material-design: true

  # Enables `flutter gen-l10n` (ARB -> AppLocalizations)
  generate: true

  # ---------------------------------------------------------------------
  # Fonts (fully offline - no runtime downloads)
  #   NooriNastaleeq : Urdu / Arabic (Jameel Noori Nastaleeq)
  #   Tinos          : English (metric-compatible with Times New Roman)
  # ---------------------------------------------------------------------
  fonts:
    - family: NooriNastaleeq
      fonts:
        - asset: assets/fonts/NooriNastaleeq-Regular.ttf
    - family: Tinos
      fonts:
        - asset: assets/fonts/Tinos-Regular.ttf
        - asset: assets/fonts/Tinos-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tinos-Italic.ttf
          style: italic
        - asset: assets/fonts/Tinos-BoldItalic.ttf
          weight: 700
          style: italic
